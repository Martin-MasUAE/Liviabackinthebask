function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(str) {
  return String(str == null ? "" : str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function weightedPick(weights) {
  const entries = Object.entries(weights).filter(([, w]) => w > 0);
  const total = entries.reduce((s, [, w]) => s + w, 0);
  let r = Math.random() * total;
  for (const [key, w] of entries) { if (r < w) return key; r -= w; }
  return entries[0] && entries[0][0];
}
function pickActivite(q2) {
  const weights = { course: 5, muscu: 3, padel: 1.2, pilates: 1.2, natation: 1, yoga: 1, ski: 0.4 };
  return weightedPick(weights);
}
function pickActiviteFromFavors(favors, difficulte, history) {
  const doneAtDiff = new Set(history.filter((h) => h.difficulte === difficulte).map((h) => h.activite));
  const notDone = favors.filter((a) => !doneAtDiff.has(a));
  const pool = notDone.length > 0 ? notDone : favors;
  return pool[Math.floor(Math.random() * pool.length)];
}
function pickDifficulte(history, energie) {
  const excluded = new Set();
  if (history.length >= 1) excluded.add(history[history.length - 1].difficulte);
  if (history.length >= 2) excluded.add(history[history.length - 2].difficulte);
  let candidates = DIFF_ORDER.filter((d) => !excluded.has(d));
  if (candidates.length === 0) candidates = DIFF_ORDER;
  if (candidates.length === 1) return candidates[0];
  const weights = {};
  if (candidates.includes("detente")) weights.detente = Math.max(0.5, 3 - energie);
  if (candidates.includes("sortie")) weights.sortie = 2;
  if (candidates.includes("challenge")) weights.challenge = Math.max(0.5, energie);
  return weightedPick(weights);
}
function pickSeance(library, activite, difficulte, history) {
  const list = (library[activite] && library[activite][difficulte]) || [];
  if (list.length === 0) return null;
  const count = history.filter((h) => h.activite === activite && h.difficulte === difficulte).length;
  const idx = Math.min(count, list.length - 1);
  return list[idx];
}
function calcPoints(seance, minutes) {
  const factor = minutes / (seance.duree || minutes);
  return Math.max(5, Math.round((seance.points * factor) / 5) * 5);
}
function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" });
}
function pickRandomQuestions(bank, n) {
  const pool = [...bank];
  const picked = [];
  while (picked.length < n && pool.length) {
    const idx = Math.floor(Math.random() * pool.length);
    picked.push(pool.splice(idx, 1)[0]);
  }
  while (picked.length < n && bank.length) picked.push(bank[0]);
  return picked;
}

function loadLocal(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
}
function saveLocal(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { console.error("Erreur de sauvegarde", key, e); }
}
function setPath(obj, path, value) {
  const parts = path.split(".");
  let o = obj;
  for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
  o[parts[parts.length - 1]] = value;
}

const CONFIG_PREFIX = "LIVIA-CONFIG:";
function encodeConfig(obj) { return CONFIG_PREFIX + btoa(unescape(encodeURIComponent(JSON.stringify(obj)))); }
function decodeConfig(str) {
  const clean = str.trim();
  const payload = clean.startsWith(CONFIG_PREFIX) ? clean.slice(CONFIG_PREFIX.length) : clean;
  return JSON.parse(decodeURIComponent(escape(atob(payload))));
}

function renderPerform() {

function renderHistory() {
  const sorted = [...state.history].reverse();
  if (!sorted.length) return `<div class="px pt"><h2 class="title-lg mb-4">Historique</h2><p class="empty-note">Aucune séance réalisée pour l'instant.</p></div>`;
  return `
  <div class="px pt">
    <h2 class="title-lg mb-5">Historique</h2>
    <div class="col gap-2">
      ${sorted.map((h) => {
        const diff = DIFFS[h.difficulte]; const open = state.expandedHistoryId === h.id;
        const previous = state.history.filter((x) => x.seanceId === h.seanceId && x.date < h.date);
        return `
        <div class="card card-l border-diff ${diff.cls}" style="padding:0;overflow:hidden;">
          <button data-act="history-toggle" data-id="${h.id}" style="width:100%;background:none;border:none;text-align:left;display:flex;align-items:center;gap:.75rem;padding:.75rem;">
            <span>${ACTS[h.activite].icon}</span>
            <div class="flex-1"><div style="font-size:.9rem;font-weight:500;" class="truncate">${esc(h.seanceTitre)}</div><div style="font-size:.75rem;color:var(--muted3);">${formatDate(h.date)} · ${diff.label}</div></div>
            <div style="color:var(--amber);font-size:.9rem;font-weight:700;">+${h.points}</div>
          </button>
          ${open ? `
          <div style="padding:0 .75rem .75rem;font-size:.85rem;border-top:1px solid var(--border);padding-top:.75rem;">
            ${Object.entries(h.performance || {}).filter(([, v]) => v).map(([k, v]) => `<div style="color:var(--muted2);"><span style="color:var(--muted3);">${esc(k)} : </span>${esc(v)}</div>`).join("")}
            <div style="color:var(--muted2);"><span style="color:var(--muted3);">Ressenti : </span>${RESSENTI_EMOJIS[h.ressenti - 1] || ""}</div>
            ${h.commentaire ? `<div style="color:var(--muted3);font-style:italic;margin-top:.3rem;">"${esc(h.commentaire)}"</div>` : ""}
            ${previous.length ? `
              <div style="margin-top:.75rem;padding-top:.75rem;border-top:1px solid var(--border);">
                <div style="font-size:.75rem;color:var(--muted3);margin-bottom:.4rem;">Fois précédentes sur cette séance</div>
                ${previous.slice(-3).reverse().map((p) => `<div style="font-size:.75rem;color:var(--muted2);">${formatDate(p.date)} — ${esc(Object.values(p.performance || {}).filter(Boolean).join(" · ") || "—")}</div>`).join("")}
              </div>` : ""}
          </div>` : ""}
        </div>`;
      }).join("")}
    </div>
  </div>`;
}

function renderRewards() {
  const tp = totalPoints();
  const sorted = [...state.rewards].sort((a, b) => a.seuil - b.seuil);
  return `
  <div class="px pt">
    <h2 class="title-lg">Récompenses</h2>
    <p style="color:var(--muted3);font-size:.9rem;margin-bottom:1.5rem;">${tp} points cumulés</p>
    <div class="col gap-3">
      ${sorted.map((r) => {
        const unlocked = tp >= r.seuil;
        return `
        <div class="card" style="display:flex;align-items:center;gap:.75rem;${unlocked ? "border-color:var(--amber);background:var(--amber-soft);" : ""}">
          <span>${unlocked ? EMO.star : EMO.lock}</span>
          <div class="flex-1">
            ${unlocked ? `<div style="font-size:.9rem;font-weight:500;">${esc(r.titre)}</div>` : `<div style="font-size:.9rem;color:var(--muted2);font-style:italic;">${esc(r.indice || "Indice à venir…")}</div>`}
            <div style="font-size:.75rem;color:var(--muted3);">${r.seuil} pts${!unlocked ? " · encore " + (r.seuil - tp) + " pts" : ""}</div>
          </div>
        </div>`;
      }).join("")}
    </div>
  </div>`;
}

  return `

    <div class="coach-tabs">
      ${tabs.map(([key, label]) => `<button class="btn-sm ${state.coachTab === key ? "active" : ""}" data-act="coach-tab" data-tab="${key}">${label}</button>`).join("")}

          <div class="row gap-2" style="align-items:flex-start;">
            <span style="font-size:.75rem;color:var(--muted3);width:4rem;flex:none;padding-top:.4rem;">Active plutôt<br/><span style="opacity:.7;">(plusieurs possibles)</span></span>
            <div class="row wrap gap-1" style="flex:1;">
              <button class="btn-pill-small ${(!o.favors || o.favors.length === 0) ? "active" : ""}" style="flex:none;padding:.4rem .6rem;" data-act="moodopt-favor-clear" data-qid="${q.id}" data-oid="${o.id}">Aucune</button>
              ${Object.entries(FAVOR_LABELS).map(([key, label]) => `<button class="btn-pill-small ${(o.favors || []).includes(key) ? "active" : ""}" style="flex:none;padding:.4rem .6rem;" data-act="moodopt-favor-toggle" data-qid="${q.id}" data-oid="${o.id}" data-val="${key}">${label}</button>`).join("")}
            </div>
          </div>
        </div>`).join("")}
    </div>
    ${q.options.length < 6 ? `<button class="btn btn-secondary" style="border-style:dashed;" data-act="moodopt-add" data-qid="${q.id}">${EMO.plus} Ajouter une option</button>` : ""}
    `;
  }
  return `
    <p style="font-size:.75rem;color:var(--muted3);margin-bottom:1.1rem;">À chaque nouvelle séance, 2 questions sont tirées au hasard dans cette banque pour éviter la répétition.</p>
    <div class="col gap-2 mb-4">
      ${state.moodBank.map((q) => `
        <div class="row gap-2 card">
          <div class="flex-1"><div style="font-size:.9rem;font-weight:500;" class="truncate">${esc(q.question)}</div><div style="font-size:.75rem;color:var(--muted3);">${q.options.length} options</div></div>
          <button class="icon-btn soft" data-act="mood-editor-open" data-id="${q.id}">${EMO.edit}</button>
          <button class="icon-btn soft" data-act="mood-q-remove" data-id="${q.id}" ${state.moodBank.length <= 2 ? "disabled" : ""}>${EMO.trash}</button>
        </div>`).join("")}
    </div>
    <button class="btn btn-secondary" style="border-style:dashed;" data-act="mood-q-add">${EMO.plus} Ajouter une question à la banque</button>
  `;
}

function renderCoachReglages() {
  return `
    <div class="card mb-5">
      <label style="display:block;font-size:.9rem;color:var(--muted);margin-bottom:.5rem;">Code d'accès au mode coach</label>
      <p style="font-size:.75rem;color:var(--muted3);margin-bottom:.8rem;">Ce code (4 à 8 chiffres) protège cet onglet. Ne le partage pas avec Livia.</p>
      <div class="row gap-2">
        <input id="pinsettings-input" type="tel" inputmode="numeric" value="${esc(state.coachPin)}" data-bind="pinsettings" style="letter-spacing:.2em;" />
        <button id="pinsettings-save-btn" class="btn-sm active" style="padding:.65rem 1rem;" data-act="pin-save">Enregistrer</button>
      </div>
    </div>
    <div class="card">
      <label style="display:block;font-size:.9rem;color:var(--muted);margin-bottom:.5rem;">Envoyer tes changements à Livia</label>
      <p style="font-size:.75rem;color:var(--muted3);margin-bottom:.8rem;">Chaque appareil garde ses propres données. Après avoir modifié des séances, récompenses ou questions, génère un code et envoie-le lui : elle l'appliquera depuis l'accueil (🔄 Mettre à jour).</p>
      <button class="btn btn-secondary mb-3" data-act="export-generate">Générer le code de mise à jour</button>
      ${state.exportCode ? `
        <textarea readonly rows="4" style="font-size:.7rem;margin-bottom:.6rem;">${state.exportCode}</textarea>
        <div class="row gap-2">
          <button class="btn btn-secondary" data-act="export-copy">${state.exportCopied ? "Copié ✓" : "Copier"}</button>
          <button class="btn btn-primary" style="padding:.65rem;" data-act="export-share">${EMO.share} WhatsApp</button>
        </div>` : ""}
    </div>
  `;
}

// ---------------------------------------------------------------------------
// RENDU PRINCIPAL
// ---------------------------------------------------------------------------

const NAV_VIEWS = ["home", "history", "rewards", "coach"];

function render() {
  let body = "";
  switch (state.view) {
    case "home": body = renderHome(); break;
    case "pinlock": body = renderPinLock(); break;
    case "importconfig": body = renderImport(); break;
    case "mood1": body = renderMood(1); break;
    case "mood2": body = renderMood(2); break;
    case "choose-activite": body = renderChooseActivite(); break;
    case "choose-seance": body = renderChooseSeance(); break;
    case "duration": body = renderDuration(); break;
    case "result": body = renderResult(); break;
    case "perform": body = renderPerform(); break;
    case "done": body = renderDone(); break;
    case "history": body = renderHistory(); break;
    case "rewards": body = renderRewards(); break;
    case "coach": body = renderCoach(); break;
    default: body = renderHome();
  }
  const showNav = NAV_VIEWS.includes(state.view);
  document.getElementById("root").innerHTML = `<div class="app">${body}${showNav ? bottomNavHTML() : ""}</div>`;
}

// ---------------------------------------------------------------------------
// DÉLÉGATION D'ÉVÉNEMENTS
// ---------------------------------------------------------------------------

document.addEventListener("click", function (e) {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  switch (act) {
    case "nav": setView(el.dataset.view); break;
    case "start-flow": startFlow(); break;
    case "start-direct-flow": startDirectFlow(); break;
    case "choose-activite": chooseActiviteDirect(el.dataset.key); break;
    case "select-direct-seance": selectDirectSeance(el.dataset.diff, el.dataset.id); break;
    case "open-lock": state.pinError = false; setView("pinlock"); break;
    case "open-import": state.importMsg = ""; setView("importconfig"); break;
    case "pin-submit": tryUnlockCoach(); break;
    case "import-apply": applyImport(); break;
    case "mood-answer": {
      const step = Number(el.dataset.step); const idx = Number(el.dataset.idx);
      answerMood(step, state.activeQuestions[step - 1].options[idx]);
      break;
    }
    case "mood-back": setView("mood1"); break;
    case "duration-back": setView("mood2"); break;
    case "duration-choose": chooseDuration(el.dataset.key); break;
    case "share-programme": shareProgramme(); break;
    case "go-perform": goPerform(); break;
    case "perform-select": setPerformSelect(el.dataset.field, el.dataset.value); break;
    case "ressenti-select": setRessenti(Number(el.dataset.value)); break;
    case "perform-submit": submitPerformance(); break;
    case "history-toggle": toggleHistory(el.dataset.id); break;
    case "coach-tab": setCoachTab(el.dataset.tab); break;
    case "coach-activite": setCoachActivite(el.dataset.key); break;
    case "coach-difficulte": setCoachDifficulte(el.dataset.key); break;
    case "seance-edit": openSeanceEditor(el.dataset.id); break;
    case "seance-cancel": cancelSeanceEditor(); break;
    case "seance-save": saveSeanceEditor(); break;
    case "seance-delete": deleteSeance(el.dataset.id); break;
    case "reward-remove": removeReward(el.dataset.id); break;
    case "reward-add-toggle": toggleAddReward(); break;
    case "reward-add": addReward(); break;
    case "mood-editor-open": openMoodEditor(el.dataset.id); break;
    case "mood-editor-back": backMoodBank(); break;
    case "mood-q-add": addMoodQuestion(); break;
    case "mood-q-remove": removeMoodQuestion(el.dataset.id); break;
    case "moodopt-energie": updateMoodOptionField(el.dataset.qid, el.dataset.oid, "energie", el.dataset.val); render(); break;
    case "moodopt-favor-toggle": toggleMoodOptionFavor(el.dataset.qid, el.dataset.oid, el.dataset.val); render(); break;
    case "moodopt-favor-clear": clearMoodOptionFavors(el.dataset.qid, el.dataset.oid); render(); break;
    case "moodopt-add": addMoodOption(el.dataset.qid); break;
    case "moodopt-remove": removeMoodOption(el.dataset.qid, el.dataset.oid); break;
    case "pin-save": savePin(); break;
    case "export-generate": generateExport(); break;
    case "export-copy": copyExport(); break;
    case "export-share": shareExport(); break;
  }
});

document.addEventListener("input", function (e) {
  const el = e.target;
  const bind = el.dataset.bind;
  if (!bind) return;
  const value = el.value;
  if (bind === "rewards") updateRewardField(el.dataset.id, el.dataset.field, value);
  else if (bind === "moodq") updateMoodQuestionField(el.dataset.qid, el.dataset.field, value);
  else if (bind === "moodopt") updateMoodOptionField(el.dataset.qid, el.dataset.oid, el.dataset.field, value);
  else if (bind === "draft") state.seanceDraft[el.dataset.field] = value;
  else if (bind === "perform") setPath(state.performDraft, el.dataset.field, value);
  else if (bind === "pin") { el.value = value.replace(/\D/g, ""); }
  else if (bind === "pinsettings") { el.value = value.replace(/\D/g, ""); }
  else if (bind === "newreward") state.newReward[el.dataset.field] = el.dataset.field === "seuil" ? Number(value) : value;
});

document.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && e.target.id === "pin-input-el") tryUnlockCoach();
});

// ---------------------------------------------------------------------------
// DÉMARRAGE
// ---------------------------------------------------------------------------

render();
</script>
</body>
</html>
